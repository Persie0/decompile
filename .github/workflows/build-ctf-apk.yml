name: Build fictional CTF APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "ctf-v1"
      publish_release:
        description: "Attach signed APK to a GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify this is the fictional CTF tree
        run: |
          set -euxo pipefail
          test -f demo/apktool.yml
          test -f demo/AndroidManifest.xml
          grep -Eq 'package="ctf\.demo([."]|$)' demo/AndroidManifest.xml

          if grep -Eq 'package="com\.linguist"' demo/AndroidManifest.xml; then
            echo 'Refusing to build the real application tree.' >&2
            exit 1
          fi

      - name: Locate Android build tools
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/build-tools"

          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          echo "Using Android build tools: $BUILD_TOOLS"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Download and verify Apktool
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar --version

      - name: Rebuild with Apktool
        run: |
          set -euxo pipefail
          rm -f ctf-unsigned.apk ctf-aligned.apk demo-signed.apk
          java -jar apktool.jar b demo -o ctf-unsigned.apk
          test -s ctf-unsigned.apk

      - name: Generate ephemeral signing key
        run: |
          set -euxo pipefail
          rm -f ctf-debug.keystore
          keytool -genkeypair \
            -keystore ctf-debug.keystore \
            -storepass ctfchallenge \
            -keypass ctfchallenge \
            -alias ctfdebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Demo CTF,O=CTF Challenge,C=AT'

      - name: Align and sign
        run: |
          set -euxo pipefail

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            ctf-unsigned.apk \
            ctf-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks ctf-debug.keystore \
            --ks-key-alias ctfdebug \
            --ks-pass pass:ctfchallenge \
            --key-pass pass:ctfchallenge \
            --out demo-signed.apk \
            ctf-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            demo-signed.apk

          "$BUILD_TOOLS/zipalign" -c -p 4 demo-signed.apk
          sha256sum demo-signed.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-signed-apk
          path: demo-signed.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euxo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" demo-signed.apk --clobber
          else
            gh release create "$TAG" \
              demo-signed.apk \
              --title "Demo CTF $TAG" \
              --notes "Signed fictional Demo CTF challenge APK built by GitHub Actions."
          fi
