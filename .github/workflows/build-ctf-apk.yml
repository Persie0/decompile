name: Build decoded APK folder

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Repository folder containing apktool.yml + AndroidManifest.xml"
        required: true
        default: "ctf-demo"
      tag:
        description: "Optional release tag; leave blank to auto-generate"
        required: false
        default: ""
      publish_release:
        description: "Attach signed APK to a GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Detect and validate source folder
        id: meta
        env:
          INPUT_SOURCE_DIR: ${{ inputs.source_dir }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          SOURCE_DIR="${INPUT_SOURCE_DIR%/}"

          case "$SOURCE_DIR" in
            ""|/*|*".."*)
              echo "Invalid source_dir: $SOURCE_DIR" >&2
              exit 1
              ;;
          esac

          test -d "$SOURCE_DIR"
          test -f "$SOURCE_DIR/apktool.yml"
          test -f "$SOURCE_DIR/AndroidManifest.xml"

          PACKAGE="$(sed -n 's/.* package="\([^"]*\)".*/\1/p' "$SOURCE_DIR/AndroidManifest.xml" | head -n 1)"
          test -n "$PACKAGE"

          # This workflow is intentionally not usable for rebuilding the real LingQ app.
          case "$PACKAGE" in
            com.linguist|com.linguist.*)
              echo "Refusing package $PACKAGE." >&2
              exit 1
              ;;
          esac

          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName:[[:space:]]*\(.*\)$/\1/p' "$SOURCE_DIR/apktool.yml" | head -n 1 | tr -d "'\"")"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode:[[:space:]]*\(.*\)$/\1/p' "$SOURCE_DIR/apktool.yml" | head -n 1 | tr -d "'\"")"

          [ -n "$VERSION_NAME" ] || VERSION_NAME="unknown"
          [ -n "$VERSION_CODE" ] || VERSION_CODE="unknown"

          SAFE_PACKAGE="$(printf '%s' "$PACKAGE" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//')"
          SAFE_VERSION="$(printf '%s' "$VERSION_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//')"
          OUTPUT_BASE="${SAFE_PACKAGE}-${SAFE_VERSION}"
          OUTPUT_APK="${OUTPUT_BASE}-signed.apk"

          if [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          else
            RELEASE_TAG="${OUTPUT_BASE}-run-${GITHUB_RUN_NUMBER}"
          fi

          echo "Detected source: $SOURCE_DIR"
          echo "Package:         $PACKAGE"
          echo "Version name:    $VERSION_NAME"
          echo "Version code:    $VERSION_CODE"
          echo "Output APK:      $OUTPUT_APK"
          echo "Release tag:     $RELEASE_TAG"

          {
            echo "SOURCE_DIR=$SOURCE_DIR"
            echo "PACKAGE=$PACKAGE"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "OUTPUT_BASE=$OUTPUT_BASE"
            echo "OUTPUT_APK=$OUTPUT_APK"
            echo "RELEASE_TAG=$RELEASE_TAG"
          } >> "$GITHUB_ENV"

      - name: Locate Android build tools
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/build-tools"

          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          echo "Using Android build tools: $BUILD_TOOLS"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Download and verify Apktool
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar --version

      - name: Rebuild with Apktool
        run: |
          set -euxo pipefail
          rm -f unsigned.apk aligned.apk "$OUTPUT_APK"
          java -jar apktool.jar b "$SOURCE_DIR" -o unsigned.apk
          test -s unsigned.apk

      - name: Generate ephemeral signing key
        run: |
          set -euxo pipefail
          rm -f build-debug.keystore
          keytool -genkeypair \
            -keystore build-debug.keystore \
            -storepass buildchallenge \
            -keypass buildchallenge \
            -alias builddebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=${PACKAGE},O=Decoded APK Build,C=AT"

      - name: Align and sign
        run: |
          set -euxo pipefail

          "$BUILD_TOOLS/zipalign" -p -f 4 unsigned.apk aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks build-debug.keystore \
            --ks-key-alias builddebug \
            --ks-pass pass:buildchallenge \
            --key-pass pass:buildchallenge \
            --out "$OUTPUT_APK" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$OUTPUT_APK"

          "$BUILD_TOOLS/zipalign" -c -p 4 "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_BASE }}-apk
          path: ${{ env.OUTPUT_APK }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          NOTES="Package: $PACKAGE\nVersion: $VERSION_NAME ($VERSION_CODE)\nSource folder: $SOURCE_DIR\nBuilt, aligned and signed by GitHub Actions."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$OUTPUT_APK" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$OUTPUT_APK" \
              --title "$PACKAGE $VERSION_NAME" \
              --notes "$NOTES"
          fi
