name: Decode LingQ 6.2.0 base APK with Apktool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apktool-demo.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and verify Apktool 3.0.3
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar --version

      - name: Download and verify LingQ 6.2.0 XAPK
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o Demo-2.0.0.xapk \
            'https://github.com/Persie0/Lingq/releases/download/1/LingQ%2B_%2BLearn%2BLanguages_6.2.0_APKPure.xapk'
          echo 'e5a18111c7b9399afd6a4434b94a79986e8201f9fb766ca58590a9de1fb5b6f3  Demo-2.0.0.xapk' | sha256sum -c -

      - name: Select and verify exact 6.2.0 base APK
        run: |
          set -euxo pipefail
          EXPECTED_BASE_SHA='edd18afdbd91deba2e6465973cdb45e8a2d9d1fdbb7a1bd13649953d0624d516'
          rm -rf xapk
          mkdir xapk
          unzip -q Demo-2.0.0.xapk -d xapk

          BASE_APK=''
          while IFS= read -r apk; do
            sha="$(sha256sum "$apk" | awk '{print $1}')"
            echo "$sha  $apk"
            if [ "$sha" = "$EXPECTED_BASE_SHA" ]; then
              BASE_APK="$apk"
              break
            fi
          done < <(find xapk -type f -name '*.apk' -print | sort)

          test -n "$BASE_APK"
          cp "$BASE_APK" Demo-2.0.0.apk
          echo "$EXPECTED_BASE_SHA  Demo-2.0.0.apk" | sha256sum -c -
          echo "Verified LingQ 6.2.0 base APK: $BASE_APK"

      - name: Run requested Apktool command
        run: |
          set -euxo pipefail
          rm -rf demo
          java -jar apktool.jar d Demo-2.0.0.apk -o demo
          test -f demo/apktool.yml
          test -f demo/AndroidManifest.xml
          grep -q '^  versionCode: 629$' demo/apktool.yml
          grep -q '^  versionName: 6.2.0$' demo/apktool.yml
          find demo -type f | wc -l
          du -sh demo

      - name: Commit decoded output
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A demo
          if git diff --cached --quiet; then
            echo 'Decoded output already matches the verified 6.2.0 base APK.'
            exit 0
          fi
          git commit -m 'Refresh Apktool decode from verified LingQ 6.2.0 base APK'
          git push origin HEAD:main
